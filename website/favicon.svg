<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile with Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Internal Radial Ambient Glow -->
  <circle cx="32" cy="30" r="22" fill="url(#glowGrad)" />

  <!-- Biometric Reticle Corners -->
  <path d="M15 22 V17 H20" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M49 22 V17 H44" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M15 42 V47 H20" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M49 42 V47 H44" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Biometric Security Shield (Hero Symbol) -->
  <path d="M32 14 L46 19.5 V31 C46 41 39.5 48 32 50.5 C24.5 48 18 41 18 31 V19.5 Z" 
        fill="#09131f" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Verified Checkmark Barrier Access Symbol -->
  <path d="M26 31.5 L30.5 36 L38.5 26.5" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
